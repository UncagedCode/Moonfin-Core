name: Moonfin Download Fix Android APK

# Purposefully scoped to this test branch and this workflow file.
# The main branch and the upstream release builds are not modified.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-emby-transcoded-downloads
    paths:
      - .github/workflows/moonfin-downloadfix-apk.yml
      - lib/data/services/**
      - lib/data/providers/offline_providers.dart
      - lib/ui/screens/downloads/**
      - packages/moonfin_native_video/android/src/main/kotlin/org/moonfin/nativevideo/Media3Transmux.kt
      - test/data/**

permissions:
  contents: read

jobs:
  build-downloadfix-android:
    name: Android arm64 test APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Unique package name: install alongside normal Moonfin.
      # Also skips Google Services, whose json does not include this package.
      MOONFIN_TEST_ID_SUFFIX: .downloadfix

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Test download-fix regressions
        run: |
          flutter test test/data/services/media3_transmux_downloader_test.dart
          flutter test test/data/services/emby_hls_download_fallback_test.dart
          flutter test test/data/failed_downloads_test.dart

      - name: Build separate arm64 Android APK
        run: |
          flutter build apk \
            --release \
            --flavor mobile \
            --target-platform android-arm64 \
            --dart-define=DISTRIBUTION_CHANNEL=apk
          test -s build/app/outputs/flutter-apk/app-mobile-release.apk
          mkdir -p delivery
          cp build/app/outputs/flutter-apk/app-mobile-release.apk \
            delivery/Moonfin_DownloadFix_Android_arm64.apk

      - name: Verify package can be opened as a ZIP/APK
        run: unzip -t delivery/Moonfin_DownloadFix_Android_arm64.apk | tail -n 2

      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonfin-DownloadFix-Android-APK
          path: delivery/Moonfin_DownloadFix_Android_arm64.apk
          if-no-files-found: error
          retention-days: 14
